name: Installation and research examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  r-portability:
    defaults:
      run:
        # PowerShell aliases R to Invoke-History on Windows.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMICSFOLD_PYTHON: unavailable-python-for-r-check
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - shell: Rscript {0}
        run: install.packages(c("jsonlite", "processx"), repos = "https://cloud.r-project.org")
      - run: R CMD build r/omicsfold
      - run: R CMD check --as-cran --no-manual omicsfold_0.1.0.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-portability-${{ matrix.os }}
          path: omicsfold.Rcheck
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build --outdir "$RUNNER_TEMP/python-dist"
      - run: python scripts/check_distributions.py "$RUNNER_TEMP/python-dist" --version 0.1.0
      - run: python -m twine check "$RUNNER_TEMP/python-dist"/*
      - name: Clean wheel installation, outside-source example and tests
        run: |
          python -c "import os,pathlib,subprocess,sys; t=pathlib.Path(os.environ['RUNNER_TEMP']); subprocess.run([sys.executable,'scripts/wheel_smoke.py','--wheel',str(next((t/'python-dist').glob('*.whl'))),'--work-dir',str(t/'python-smoke'),'--tests','tests'],check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/python-dist/*
            ${{ runner.temp }}/python-smoke/example/*
  r:
    runs-on: ubuntu-latest
    env:
      OMICSFOLD_REQUIRE_PYTHON: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
      - run: python -m pip install build
      - run: python -m build --outdir "$RUNNER_TEMP/python-dist"
      - run: python -m pip install "$RUNNER_TEMP"/python-dist/*.whl
      - shell: Rscript {0}
        run: install.packages(c("jsonlite", "processx"), repos = "https://cloud.r-project.org")
      - run: R CMD build r/omicsfold
      - run: R CMD INSTALL omicsfold_0.1.0.tar.gz
      - run: R CMD check --as-cran --no-manual omicsfold_0.1.0.tar.gz
      - run: Rscript examples/benchmark.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-installation-check
          path: |
            omicsfold.Rcheck
            examples/results/r-benchmark
