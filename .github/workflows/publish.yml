name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Package index
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python scripts/check_distributions.py dist --version 0.1.0
      - run: python -m twine check dist/*
      - run: python scripts/wheel_smoke.py --wheel dist/omicsfold-0.1.0-py3-none-any.whl --work-dir "$RUNNER_TEMP/smoke" --tests tests
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish to TestPyPI
        if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
