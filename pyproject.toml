[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "omicsfold"
version = "0.1.0"
description = "Reproducible binary classification for omics data with group-aware validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scikit-learn>=1.6,<2", "threadpoolctl>=3.1", "packaging>=24"]
license = "MIT"
authors = [{name = "Shahroz Rahman"}]
keywords = ["omics", "classification", "cross-validation", "reproducibility"]

[project.urls]
Repository = "https://github.com/ShahrozRahman/OmicsFold"
Issues = "https://github.com/ShahrozRahman/OmicsFold/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
release = ["build>=1.2", "twine>=6"]

[project.scripts]
omicsfold = "omicsfold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omicsfold = ["data/*.tsv", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
